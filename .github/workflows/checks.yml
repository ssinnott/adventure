# The checks every pull request must pass before it merges: the typecheck, the tests and the smoke
# test, each its own job so the pull request shows each, and the smoke's crack sweep beside them in
# the plan job and the sweep job's shards (#953). Main has no branch protection (the owner,
# 18 October 2026): the orchestrating session merges one pull request at a time, each up to date
# with main and green on all five, the sweep skipped only where the plan sweeps no map
# (docs/EXPANSION.md §8.3). No path filters: a pull request that touches only docs must still
# report, or it waits on checks that never come. The contact sheet's job and the lanes' job, last,
# are not among the five: the first attaches pictures for the owner and the second says which lanes
# the files fall in, and neither is required. Nor is the pilot's full run (`fullrun`,
# docs/PILOT.md), which runs only when started by hand: a report, not a gate.
name: Checks

on:
  pull_request:
  # Everything once a day, off the hour (#955), as a run started by hand (a release's) does: the
  # gate and every walkthrough, and every map swept with the audit. Only the pilot's full run, a
  # report, waits to be started by hand. GitHub runs a schedule on the default branch alone.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      fullrun:
        description: "The pilot's full run: the areas whose chapters it plays (FULLRUN: area ids with commas between, or all)"
        default: all

permissions:
  contents: read

# A new push to a pull request cancels the run on the push before it. The nightly and a run started
# by hand on the same branch are in groups of their own, so neither cancels the other.
concurrency:
  group: checks-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  tests:
    runs-on: ubuntu-latest
    # The suites took 6 to 8.5 minutes on the heads measured, the runner's spread about two (#873): the
    # cap is the runner's budget, not a check. The aim stays under three minutes (EXPANSION §10).
    # A pull request runs the gate only for the areas its files reach (TEST_SINCE,
    # tools/changed.ts, #955) and every other suite whole, the walkthroughs for those areas or,
    # where more than a comment changed, all; any other event runs everything.
    timeout-minutes: 15
    steps:
      # A pull request is checked out as its merge into the base: the commit before is the base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm test ends with the pilot's full run on the shelf (tools/tests/fullrun.ts, FULLRUN unset): about ten seconds.
      # The runner says which areas ran and why, and writes that and its table of seconds into the
      # run's summary.
      - run: npm test
        env:
          TEST_SINCE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

  smoke:
    runs-on: ubuntu-latest
    # The smoke but the four-way crack sweep, which the sweep job runs: 118 to 167 s of `npm run smoke`
    # in the jobs that swept nothing, the Chromium install up to 694 s (#953).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Headless runs need only Chromium's headless shell. It is not cached: with the shell cached,
      # its system libraries alone took as long to install as shell and libraries together (19 s).
      - run: npx playwright install --with-deps --only-shell chromium
      # Everything but the crack sweep's four ways: the plan and sweep jobs run them beside this one.
      - run: npm run smoke
        env:
          SMOKE_SHOT: smoke.png
          SMOKE_PART: rest
          # On the nightly and a run started by hand the one-way sweeps here (the cellar, Helmstow,
          # its keep and the ground's samples, which no map holds yet) take the audit too, as the
          # sweep's shards do.
          SMOKE_SWEEP_AUDIT: ${{ github.event_name != 'pull_request' && '1' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke.png
          if-no-files-found: ignore

  # The crack sweep's plan (tools/sweep.ts, tools/kit/sweep.ts): the maps a pull request changes
  # (tools/changed.ts), every map on the nightly and a run started by hand, which is the sweep a
  # release gets, with the audit, and the shards they call for, one for each 60,000 pairs of paints
  # (about four minutes), none when no map is swept. A pull request is checked out as its merge into
  # the base: the commit before is the base. It needs Node alone, as the lanes job does, so the
  # sweep starts in seconds.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      sweep: ${{ steps.plan.outputs.sweep }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        run: node tools/sweep.ts
        env:
          SMOKE_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
          SMOKE_SWEEP: ${{ github.event_name != 'pull_request' && 'all' || '' }}
          SMOKE_SWEEP_AUDIT: ${{ github.event_name != 'pull_request' && '1' || '' }}

  # The crack sweep all four ways from every square of the maps the plan names, each shard of it a job
  # of its own, side by side, each paying the Chromium install; one shard failing stops none of the
  # others. On the nightly and a run started by hand each shard runs the audit too
  # (SMOKE_SWEEP_AUDIT): the old sweep beside the new on every view, which holds the plan's skip and
  # key to the painter.
  sweep:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run smoke
        env:
          SMOKE_PART: sweep
          SMOKE_SHARD: ${{ matrix.shard }}
          SMOKE_SWEEP: ${{ needs.plan.outputs.sweep }}
          SMOKE_SWEEP_AUDIT: ${{ github.event_name != 'pull_request' && '1' || '' }}

  # The pilot's full run (tools/tests/fullrun.ts; docs/PILOT.md, Full runs): a new game played by the
  # pilot alone, chapter after chapter, on the areas the run's `fullrun` input names (all unless
  # changed). Started by hand only, never on a pull request or the nightly: its result is a report,
  # not a gate, until the pilot finishes those chapters. Its lines go into the run's summary, every
  # one listed (#895); each chapter's play has ten minutes of the wall clock, fair and omniscient
  # alike.
  fullrun:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - shell: bash
        run: node tools/test.ts fullrun --list 2>&1 | tee fullrun.txt
        env:
          FULLRUN: ${{ inputs.fullrun }}
      - if: always()
        shell: bash
        run: |
          { echo "### The pilot's full run (FULLRUN=${FULLRUN})"; echo; echo '```'; grep -E '^  (ok|FAIL|note)' fullrun.txt || echo 'no lines: the run did not start'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env:
          FULLRUN: ${{ inputs.fullrun }}

  # The contact sheet (tools/sheet.ts): the maps, monsters and interiors the pull request changed, on
  # one page for the owner to judge. Attached to the run, not a required check; a pull request that
  # changes none of them gets no sheet and a line saying so.
  sheet:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node tools/sheet.ts sheet.png --changed HEAD^1
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: contact-sheet
          path: sheet.png
          if-no-files-found: ignore
      - run: |
          if [ -f sheet.png ]; then
            echo "Contact sheet: [contact-sheet](${{ steps.upload.outputs.artifact-url }}) (a zip holding sheet.png)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No map, monster or interior changed: no contact sheet." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The lanes (tools/lanes.ts, docs/EXPANSION.md §8.1): the lanes the pull request's files fall in,
  # each with its files, beside the lane labels its event carries, in the run's summary, with a line
  # for each lane a file falls in that the labels lack and each label no file falls under. It tells
  # and never gates: the tool exits 0 whatever it finds, and the step may not fail the job. The
  # labels are those the event carried when the run began, so ones put on after a pull request opens
  # show from the next push's run (a re-run of the job reads the same event). It needs Node alone, so
  # its report comes in seconds, not after the sheet job's Chromium.
  lanes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The pull request is checked out as its merge into the base: the commit before is the base,
      # and what changed since is the pull request's files.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/lanes.ts HEAD^1
        continue-on-error: true
